<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulado Schaeffler — Prova 2</title><style>
:root{--bg:#07110c;--card:#0f1b14;--line:#284634;--text:#eef7f1;--muted:#a6b7ac;--acc:#55d98b;--bad:#ff6b6b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#07110c,#0b1710);color:var(--text)}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}header{position:sticky;top:0;background:#07110ce8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:9}.top{display:flex;justify-content:space-between;padding:14px 0;font-weight:800}.timer{color:var(--acc)}.hero{padding:42px 0 20px}h1{font-size:clamp(34px,6vw,58px);margin:0 0 10px}.lead{color:var(--muted);line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.stat,.q,.reading,.result{background:var(--card);border:1px solid var(--line);border-radius:18px}.stat{padding:16px}.stat b{font-size:24px;display:block}.stat span{color:var(--muted);font-size:13px}.prog{height:11px;background:#132219;border-radius:99px;overflow:hidden;border:1px solid var(--line)}.fill{height:100%;width:0;background:var(--acc)}.section{margin:34px 0 12px}.reading{padding:20px;line-height:1.7;color:#dce9df}.q{padding:20px;margin:12px 0}.q.correct{border-color:var(--acc)}.q.wrong{border-color:var(--bad)}.qtitle{display:flex;gap:12px;line-height:1.5;font-weight:700}.num{min-width:36px;height:36px;border-radius:10px;background:#183222;color:var(--acc);display:grid;place-items:center}.opts{display:grid;gap:9px;margin-top:16px}.opt{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;cursor:pointer}.opt:hover{border-color:#4e765e}input{accent-color:var(--acc)}.actions{position:sticky;bottom:12px;display:flex;justify-content:center;gap:10px;padding:18px 0}button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:var(--acc);color:#05210e}.secondary{background:#14261a;color:var(--text);border:1px solid var(--line)}.result{display:none;padding:22px;margin:26px 0 60px}.score{font-size:50px;color:var(--acc);font-weight:900}.row{display:grid;grid-template-columns:160px 1fr 60px;gap:10px;align-items:center;margin:10px 0}.bar{height:10px;background:#17281d;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--acc)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.row{grid-template-columns:110px 1fr 48px}}
</style></head><body><header><div class="wrap top"><div>● Simulado Schaeffler</div><div id="timer" class="timer">02:00:00</div></div></header><main class="wrap"><section class="hero"><h1>Prova 2</h1><p class="lead">30 questões de Matemática, Português e Raciocínio Lógico. Faça como se fosse a prova real e finalize para ver sua correção.</p><div class="stats"><div class="stat"><b>30</b><span>questões</span></div><div class="stat"><b>3</b><span>áreas</span></div><div class="stat"><b>2h</b><span>tempo</span></div><div class="stat"><b id="answered">0</b><span>respondidas</span></div></div><div class="prog"><div id="fill" class="fill"></div></div></section><section id="quiz"></section><div class="actions"><button class="secondary" onclick="resetQuiz()">Limpar</button><button class="primary" onclick="finishQuiz()">Finalizar prova</button></div><section id="result" class="result"><div id="score" class="score"></div><h2>Resultado</h2><p id="summary" class="lead"></p><div id="bars"></div></section></main><script>
const qs=[{"n": 1, "cat": "Matemática", "q": "Um produto custava R$ 1.800,00. Seu preço aumentou 15% e depois recebeu um desconto de 10% sobre o novo valor. Qual foi o preço final?", "opts": ["R$ 1.800,00", "R$ 1.830,00", "R$ 1.863,00", "R$ 1.890,00", "R$ 2.070,00"], "ans": 2}, {"n": 2, "cat": "Matemática", "q": "Em uma empresa, a razão entre homens e mulheres é de 3 para 5. Sabendo que existem 320 funcionários, quantas são mulheres?", "opts": ["120", "160", "180", "200", "240"], "ans": 3}, {"n": 3, "cat": "Matemática", "q": "Oito funcionários produzem 480 peças em 6 horas. Mantendo o mesmo ritmo, quantas peças 10 funcionários produzirão em 8 horas?", "opts": ["640", "720", "760", "800", "840"], "ans": 3}, {"n": 4, "cat": "Matemática", "q": "Um valor de R$ 1.500,00 foi aplicado a juros simples de 2% ao mês durante 5 meses. Qual será o valor total ao final?", "opts": ["R$ 1.600,00", "R$ 1.620,00", "R$ 1.650,00", "R$ 1.680,00", "R$ 1.750,00"], "ans": 2}, {"n": 5, "cat": "Matemática", "q": "Um candidato obteve as notas 7,0 — 8,0 — 6,0 — X. Para que sua média seja 7,5, a última nota deverá ser:", "opts": ["7,5", "8,0", "8,5", "9,0", "9,5"], "ans": 3}, {"n": 6, "cat": "Matemática", "q": "Um estoque possuía 320 peças. Primeiro foram retirados 3/8 do estoque. Depois foram retirados 25% do que havia restado. Quantas peças sobraram?", "opts": ["120", "140", "150", "160", "180"], "ans": 2}, {"n": 7, "cat": "Matemática", "q": "Resolva: 4x − 7 = 2x + 13", "opts": ["7", "8", "9", "10", "12"], "ans": 3}, {"n": 8, "cat": "Matemática", "q": "Um veículo percorreu 180 km em 2 horas e 30 minutos, mantendo velocidade média constante. Qual foi sua velocidade média?", "opts": ["60 km/h", "68 km/h", "70 km/h", "72 km/h", "75 km/h"], "ans": 3}, {"n": 9, "cat": "Matemática", "q": "Um produto de R$ 2.400 recebeu desconto de 20%. Logo depois, seu novo preço foi aumentado em 25%. O preço final será:", "opts": ["R$ 2.160", "R$ 2.280", "R$ 2.304", "R$ 2.400", "R$ 2.500"], "ans": 3}, {"n": 10, "cat": "Matemática", "q": "Uma empresa recebeu 600 peças. Na inspeção, 8% foram consideradas defeituosas. Quantas peças foram aprovadas?", "opts": ["532", "540", "548", "552", "568"], "ans": 3}, {"n": 11, "cat": "Português", "q": "A principal ideia do texto é:", "opts": ["A velocidade é a característica mais importante de um funcionário.", "Trabalhar lentamente evita qualquer tipo de erro.", "Produtividade envolve rapidez, qualidade e responsabilidade.", "Os erros são inevitáveis no ambiente profissional.", "Fazer mais tarefas significa sempre ser mais produtivo."], "ans": 2}, {"n": 12, "cat": "Português", "q": "No trecho “Por isso, produtividade não significa...”, a expressão “Por isso” indica:", "opts": ["oposição", "conclusão", "comparação", "dúvida", "condição"], "ans": 1}, {"n": 13, "cat": "Português", "q": "De acordo com o texto, um erro causado por falta de atenção:", "opts": ["não prejudica a produtividade.", "sempre pode ser corrigido rapidamente.", "pode gerar perda adicional de tempo.", "é resultado da lentidão.", "deve ser ignorado."], "ans": 2}, {"n": 14, "cat": "Português", "q": "Na frase “Um erro cometido por falta de cuidado pode exigir mais tempo...”, a palavra “erro” é:", "opts": ["verbo", "adjetivo", "pronome", "substantivo", "advérbio"], "ans": 3}, {"n": 15, "cat": "Português", "q": "A palavra “responsabilidade” pode ser relacionada, no contexto, principalmente a:", "opts": ["descuido.", "compromisso.", "velocidade.", "competição.", "descanso."], "ans": 1}, {"n": 16, "cat": "Português", "q": "Assinale a alternativa correta quanto ao uso da crase.", "opts": ["O candidato entregou o documento à supervisora.", "O candidato começou à preencher a prova.", "Todos chegaram à pé.", "A prova foi entregue à todos.", "Ele ficou frente à frente à gerente."], "ans": 0}, {"n": 17, "cat": "Português", "q": "Assinale a frase com concordância correta.", "opts": ["Haviam vinte pessoas na sala.", "Fazem três meses que ele trabalha aqui.", "Existe muitos candidatos interessados.", "Havia muitos candidatos aguardando.", "Faltou três documentos."], "ans": 3}, {"n": 18, "cat": "Português", "q": "Assinale a alternativa corretamente pontuada.", "opts": ["Durante a prova os candidatos permaneceram em silêncio.", "Durante a prova, os candidatos permaneceram em silêncio.", "Durante, a prova os candidatos permaneceram em silêncio.", "Durante a prova os candidatos, permaneceram em silêncio.", "Durante a prova, os candidatos, permaneceram em silêncio."], "ans": 1}, {"n": 19, "cat": "Português", "q": "Qual alternativa apresenta todas as palavras escritas corretamente?", "opts": ["excessão – experiência – análise", "exceção – esperiência – análise", "exceção – experiência – análise", "exceção – experiência – análize", "excessão – experiência – análize"], "ans": 2}, {"n": 20, "cat": "Português", "q": "Na frase “Chegaram cedo os candidatos selecionados.” O sujeito da oração é:", "opts": ["chegaram", "cedo", "os candidatos selecionados", "selecionados", "inexistente"], "ans": 2}, {"n": 21, "cat": "Raciocínio Lógico", "q": "Complete a sequência: 4 – 7 – 13 – 25 – 49 – ?", "opts": ["73", "81", "89", "97", "101"], "ans": 3}, {"n": 22, "cat": "Raciocínio Lógico", "q": "Observe: 1 – 4 – 10 – 22 – 46 – ?", "opts": ["82", "88", "92", "94", "96"], "ans": 3}, {"n": 23, "cat": "Raciocínio Lógico", "q": "Considere: Se Pedro trabalha, então João estuda. Sabemos que João não estudou. Logo:", "opts": ["Pedro trabalhou.", "Pedro não trabalhou.", "João trabalhou.", "Pedro estudou.", "Nada pode ser concluído."], "ans": 1}, {"n": 24, "cat": "Raciocínio Lógico", "q": "Ana é mais velha que Bruno. Bruno é mais velho que Carlos. Carlos é mais velho que Daniel. Quem é o segundo mais velho?", "opts": ["Ana", "Bruno", "Carlos", "Daniel", "Não é possível saber"], "ans": 1}, {"n": 25, "cat": "Raciocínio Lógico", "q": "Em uma seleção, 60 candidatos acertaram Matemática, 45 acertaram Português e 25 acertaram as duas matérias. Quantos acertaram pelo menos uma das duas matérias?", "opts": ["70", "75", "80", "85", "105"], "ans": 2}, {"n": 26, "cat": "Raciocínio Lógico", "q": "Em determinado código, cada letra é substituída pela próxima letra do alfabeto. CASA → DBTB. Seguindo a mesma regra: MESA → ?", "opts": ["NFTB", "NFSB", "NFUB", "OFTB", "MFSA"], "ans": 0}, {"n": 27, "cat": "Raciocínio Lógico", "q": "Hoje é quarta-feira. Que dia da semana será daqui a 17 dias?", "opts": ["Quinta-feira", "Sexta-feira", "Sábado", "Domingo", "Segunda-feira"], "ans": 2}, {"n": 28, "cat": "Raciocínio Lógico", "q": "Três funcionários — Ana, Bruno e Carlos — ocupam Administrativo, Produção e Qualidade. Ana não trabalha na Produção. Bruno trabalha na Qualidade. Carlos não trabalha no Administrativo. Em qual setor Ana trabalha?", "opts": ["Produção", "Qualidade", "Administrativo", "Produção ou Qualidade", "Não é possível determinar"], "ans": 2}, {"n": 29, "cat": "Raciocínio Lógico", "q": "Observe: A, C, F, J, O, ?", "opts": ["S", "T", "U", "V", "W"], "ans": 2}, {"n": 30, "cat": "Raciocínio Lógico", "q": "Cinco pessoas estão em uma fila. João está à frente de Pedro. Pedro está à frente de Lucas. Ana está atrás de Lucas. Qual afirmação é necessariamente verdadeira?", "opts": ["Ana está à frente de João.", "Lucas está à frente de Pedro.", "João está à frente de Lucas.", "Pedro está atrás de Ana.", "Ana é a última da fila."], "ans": 2}];const text="No ambiente de trabalho, cumprir tarefas rapidamente pode ser importante, mas a velocidade não substitui a atenção. Um erro cometido por falta de cuidado pode exigir mais tempo para ser corrigido do que aquele que seria gasto fazendo o trabalho corretamente desde o início. Por isso, produtividade não significa apenas fazer mais em menos tempo, mas também realizar as atividades com qualidade e responsabilidade.";const letters=['A','B','C','D','E'];const quiz=document.getElementById('quiz');let cat='';qs.forEach(q=>{if(q.cat!==cat){cat=q.cat;let h=document.createElement('h2');h.className='section';h.textContent=cat;quiz.appendChild(h);if(cat==='Português'){let r=document.createElement('div');r.className='reading';r.innerHTML='<b>Texto para as questões 11 a 15</b><br><br>'+text;quiz.appendChild(r)}}let a=document.createElement('article');a.className='q';a.id='q'+q.n;a.innerHTML=`<div class="qtitle"><div class="num">${q.n}</div><div>${q.q}</div></div><div class="opts">${q.opts.map((o,i)=>`<label class="opt"><input type="radio" name="q${q.n}" value="${i}"><span><b>${letters[i]})</b> ${o}</span></label>`).join('')}</div>`;quiz.appendChild(a)});
function update(){let n=qs.filter(q=>document.querySelector(`input[name=q${q.n}]:checked`)).length;answered.textContent=n;fill.style.width=(n/qs.length*100)+'%'}document.addEventListener('change',update);function finishQuiz(){let miss=qs.filter(q=>!document.querySelector(`input[name=q${q.n}]:checked`)).length;if(miss&&!confirm(`Faltam ${miss} questão(ões). Finalizar mesmo assim?`))return;let c=0,b={};qs.forEach(q=>{b[q.cat]??={t:0,c:0};b[q.cat].t++;let e=document.querySelector(`input[name=q${q.n}]:checked`),v=e?+e.value:-1,box=document.getElementById('q'+q.n);box.classList.remove('correct','wrong');if(v===q.ans){c++;b[q.cat].c++;box.classList.add('correct')}else box.classList.add('wrong')});score.textContent=`${c}/30`;summary.textContent=`Você acertou ${c} de 30 questões (${Math.round(c/30*100)}%).`;bars.innerHTML=Object.entries(b).map(([k,v])=>`<div class="row"><span>${k}</span><div class="bar"><span style="width:${v.c/v.t*100}%"></span></div><b>${v.c}/${v.t}</b></div>`).join('');result.style.display='block';result.scrollIntoView({behavior:'smooth'})}function resetQuiz(){if(!confirm('Apagar todas as respostas?'))return;document.querySelectorAll('input').forEach(x=>x.checked=false);document.querySelectorAll('.q').forEach(x=>x.classList.remove('correct','wrong'));result.style.display='none';update()}let s=7200;setInterval(()=>{if(s<=0)return;s--;let h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),x=String(s%60).padStart(2,'0');timer.textContent=`${h}:${m}:${x}`},1000);
</script></body></html>
